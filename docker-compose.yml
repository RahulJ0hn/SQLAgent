version: "3.9"

services:
  postgres:
    build: ./database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-sqlagent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-sqlagent_dev}
      POSTGRES_DB: ${PG_DATABASE:-retaildb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d retaildb"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

  agent:
    build: ./agent
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      PG_HOST: postgres
      CHROMA_HOST: chromadb

  orchestrator:
    build: ./orchestrator
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      AGENT_URL: http://agent:8080

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator

volumes:
  pgdata:
  chromadata:
